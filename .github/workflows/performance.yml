name: Run Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  performance:
    name: K6 Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run K6 smoke performance tests
        run: k6 run --summary-export performance-summary.json performance/scenarios/demoblaze-smoke.js

      - name: Validate K6 load scenario
        run: k6 inspect performance/scenarios/demoblaze-load.js

      - name: Validate K6 stress scenario
        run: k6 inspect performance/scenarios/demoblaze-stress.js

      - name: Validate K6 spike scenario
        run: k6 inspect performance/scenarios/demoblaze-spike.js

      - name: Generate Allure-compatible performance results
        if: always()
        run: npm run allure:performance

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload performance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-summary
          path: performance-summary.json

      - name: Upload Performance Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-allure-report
          path: allure-report

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    name: Deploy Performance Allure Report
    if: always() && github.ref == 'refs/heads/main'
    needs: performance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
